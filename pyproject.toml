[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "qantara"
version = "0.3.1"
description = "Local-first voice gateway for Ollama, local LLMs, and local AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Qantara maintainers" }]
keywords = ["voice-ai", "local-first", "local-llm", "ai-agents", "speech-to-text", "text-to-speech", "ollama", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.14,<4",
]

[project.urls]
Homepage = "https://github.com/nawaf1-art/Qantara"
Repository = "https://github.com/nawaf1-art/Qantara"
Issues = "https://github.com/nawaf1-art/Qantara/issues"

[project.optional-dependencies]
# Local STT/TTS. Piper needs the external `piper` binary on PATH; Kokoro
# pulls PyTorch transitively. Without this extra the gateway still runs with
# the demo backend and synthetic audio.
speech = ["faster-whisper>=1.2,<2", "kokoro>=0.9.4,<0.10", "numpy>=2.0,<3", "soundfile>=0.13"]
# Multi-device mesh + Home Assistant Wyoming satellite.
mesh = ["zeroconf>=0.150,<0.151", "wyoming>=1.10,<2"]
# MCP client adapter + MCP voice server.
mcp = ["mcp>=1.28,<1.29"]
chatterbox = ["chatterbox-tts>=0.1.2,<0.2"]
# Lightweight dependencies required by the repository's unit-test suite.
# Real speech models and model downloads are intentionally excluded.
test = [
    "jsonschema>=4.23,<5",
    "mcp>=1.28,<1.29",
    "numpy>=2.0,<3",
    "wyoming>=1.10,<2",
    "zeroconf>=0.150,<0.151",
]
dev = [
    "build==1.5.0",
    "pip-audit==2.10.1",
    "ruff==0.16.3",
    "twine==7.0.0",
]

# The wheel intentionally ships the existing top-level packages (gateway,
# adapters, providers, discovery) plus the client/identity asset trees next
# to them, because all internal imports and asset paths resolve relative to
# the install root. A future minor release may consolidate these under the
# qantara.* namespace after the compatibility plan is approved.
[tool.hatch.build.targets.wheel]
packages = ["qantara", "adapters", "gateway", "providers", "discovery"]

[tool.hatch.build.targets.wheel.force-include]
"client" = "client"
"identity" = "identity"
"protocols" = "protocols"
"schemas" = "schemas"

[tool.hatch.build.targets.sdist]
include = [
    "qantara",
    "adapters",
    "gateway",
    "providers",
    "discovery",
    "client",
    "identity",
    "protocols",
    "schemas",
    "scripts",
    "tests",
    "VERSION",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "FEATURES.md",
    "GOVERNANCE.md",
    "ROADMAP.md",
    "SECURITY.md",
    "SUPPORT.md",
    "qantara.example.yml",
    "docs",
]
exclude = [
    "docs/audits",
    "docs/internal",
    "docs/SESSION_HANDOFF.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "__pycache__",
    ".venv",
    "client",
    "identity/avatar-packs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long — many descriptive log lines are long by design
    "B008",  # function call in default argument — aiohttp patterns use this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E"]
