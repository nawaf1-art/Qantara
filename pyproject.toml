[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "qantara"
version = "0.3.1"
description = "Local-first voice gateway for Ollama, local LLMs, and local AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Qantara maintainers" }]
keywords = ["voice-ai", "local-first", "local-llm", "ai-agents", "speech-to-text", "text-to-speech", "ollama", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.14,<4",
]

[project.scripts]
qantara = "qantara.cli:main"
qantara-doctor = "qantara.doctor:main"

[project.urls]
Homepage = "https://github.com/nawaf1-art/Qantara"
Repository = "https://github.com/nawaf1-art/Qantara"
Issues = "https://github.com/nawaf1-art/Qantara/issues"

# Extras declare compatible ranges (minimum + major-version cap) so Qantara can
# share an environment with other tools; exact, hash-pinned versions live only
# in the lock files (ops/docker/requirements.txt, regenerated by
# scripts/lock_requirements.py).
[project.optional-dependencies]
# Local STT/TTS: faster-whisper plus Kokoro. Every Kokoro release requires
# Python <3.13, so on 3.13+ this extra installs STT only; use a Python 3.12
# venv for Kokoro, or Piper (operator-supplied runtime and voices). On Linux
# CPU-only machines install torch from the PyTorch CPU index first (see
# docs/INSTALLATION_AND_FIRST_RUN_GUIDE.md) to avoid the CUDA stack.
speech = [
    "faster-whisper>=1.2,<2",
    "kokoro>=0.9.4,<1; python_version < '3.13'",
    "numpy>=2.0,<3",
    "soundfile>=0.13,<1",
]
# Multi-device mesh discovery.
mesh = ["zeroconf>=0.150,<1"]
# MCP client adapter + MCP voice server. mcp 2.x removed the streamable HTTP
# client API the adapter uses; lift the cap with that migration.
mcp = ["mcp>=1.28,<2", "httpx>=0.27,<1"]
chatterbox = ["chatterbox-tts>=0.1.2,<1"]
# Lightweight dependencies required by the repository's unit-test suite.
# Real speech models and model downloads are intentionally excluded.
test = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.28,<2",
    "numpy>=2.0,<3",
    "zeroconf>=0.150,<1",
]
# Maintainer tooling; keep in sync with .github/workflows and pre-commit.
dev = [
    "build==1.6.0",
    "pip-audit==2.10.1",
    "ruff==0.16.5",
    "twine==7.0.0",
]

# The wheel intentionally ships the existing top-level packages (gateway,
# adapters, providers, discovery) plus the client/identity asset trees next
# to them, because all internal imports and asset paths resolve relative to
# the install root. A future minor release may consolidate these under the
# qantara.* namespace after the compatibility plan is approved.
[tool.hatch.build.targets.wheel]
packages = ["qantara", "adapters", "gateway", "providers", "discovery"]
# Lock files are deployment inputs, not package contents (and would make SBOM
# scanners report the Docker stack as wheel dependencies).
exclude = ["**/requirements*.txt", "**/requirements*.in"]

[tool.hatch.build.targets.wheel.force-include]
"client" = "client"
"identity" = "identity"
"protocols" = "protocols"
"schemas" = "schemas"

[tool.hatch.build.targets.sdist]
include = [
    "qantara",
    "adapters",
    "gateway",
    "providers",
    "discovery",
    "client",
    "identity",
    "protocols",
    "schemas",
    "scripts",
    "tests",
    "cli.py",
    "config.py",
    "mcp_server.py",
    "VERSION",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "docs/FEATURES.md",
    "GOVERNANCE.md",
    "ROADMAP.md",
    "SECURITY.md",
    "SUPPORT.md",
    "qantara.example.yml",
    "docs",
]
exclude = [
    "docs/audits",
    "docs/internal",
    "docs/SESSION_HANDOFF.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "__pycache__",
    ".venv",
    "client",
    "identity/avatar-packs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long — many descriptive log lines are long by design
    "B008",  # function call in default argument — aiohttp patterns use this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E"]
