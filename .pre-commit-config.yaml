repos:
  # Keep the ruff version in sync with the dev extra in pyproject.toml and the
  # pins in .github/workflows/test.yml and release.yml. Formatting is not
  # enforced (CI runs `ruff check` only), so there is no ruff-format hook.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
      - id: check-json
        exclude: ^identity/voice-registry/voices\.json$
      - id: check-added-large-files
        args: [--maxkb=500]
