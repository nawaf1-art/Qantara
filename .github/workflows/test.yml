name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Keep these pins in sync with the dev extra in pyproject.toml,
      # release.yml and .pre-commit-config.yaml.
      - name: Install quality and package tools
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "build==1.6.0" "ruff==0.16.5" "twine==7.0.0"

      - name: Check release metadata
        run: |
          python scripts/check_release_consistency.py
          python scripts/check_workflow_pins.py
          python scripts/check_docs_links.py
          python scripts/check_docs_consistency.py
          python scripts/check_tracked_artifacts.py

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q qantara adapters gateway providers discovery tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Smoke-test clean wheel install
        run: python scripts/smoke_install.py --expected "$(cat VERSION)" dist/*.whl

      - name: Smoke-test clean source install
        run: python scripts/smoke_install.py --expected "$(cat VERSION)" dist/*.tar.gz

  lock-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Equivalent to `pip download --require-hashes --only-binary=:all:
      # --no-deps` per target, checked from index metadata so no multi-GB
      # wheels are downloaded: cp311/cp312 x linux x86_64/aarch64, win_amd64,
      # macOS arm64.
      - name: Verify hash locks cover every supported platform
        run: python scripts/check_lock_hashes.py

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies without speech models
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install ".[test]"

      - name: Run unit tests
        env:
          QANTARA_WHISPER_MODEL: "tiny.en"
        run: python -m unittest discover -s tests -v

  extras-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install resolver
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "uv==0.11.14"

      # Dry-run resolution of the documented native install for each OS. The
      # CPU torch backend matches the documented CPU install; Kokoro must be
      # present below 3.13 and skipped (not a resolver error) on 3.13+.
      - name: Resolve .[speech,mesh,mcp] without installing
        shell: bash
        env:
          PYVER: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          for platform in x86_64-manylinux_2_28 aarch64-manylinux_2_28 x86_64-pc-windows-msvc aarch64-apple-darwin; do
            echo "::group::$PYVER $platform"
            uv pip compile pyproject.toml \
              --extra speech --extra mesh --extra mcp \
              --python-version "$PYVER" --python-platform "$platform" \
              --torch-backend cpu --no-header --quiet \
              --output-file "resolved-$platform.txt"
            grep -E '^(faster-whisper|mcp|zeroconf|httpx)==' "resolved-$platform.txt"
            if python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 13) else 1)'; then
              if grep -q '^kokoro==' "resolved-$platform.txt"; then
                echo "kokoro must be skipped on Python $PYVER" >&2
                exit 1
              fi
            else
              grep '^kokoro==' "resolved-$platform.txt"
            fi
            echo "::endgroup::"
          done

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit the base runtime dependency set
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install . "pip-audit==2.10.1"
          # Qantara is intentionally not on PyPI yet. Removing only the
          # local distribution leaves its resolved third-party dependencies in
          # place for strict auditing without a false "not found" failure.
          python -m pip uninstall --yes qantara
          python -m pip_audit --strict

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
