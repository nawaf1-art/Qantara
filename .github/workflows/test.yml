name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality and package tools
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "build==1.5.0" "ruff==0.16.2" "twine==7.0.0"

      - name: Check release metadata
        run: |
          python scripts/check_release_consistency.py
          python scripts/check_workflow_pins.py
          python scripts/check_docs_links.py
          python scripts/check_docs_consistency.py
          python scripts/check_tracked_artifacts.py

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q qantara adapters gateway providers discovery tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Smoke-test clean wheel install
        run: python scripts/smoke_install.py --expected 0.3.1 dist/*.whl

      - name: Smoke-test clean source install
        run: python scripts/smoke_install.py --expected 0.3.1 dist/*.tar.gz

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies without speech models
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install ".[test]"

      - name: Run unit tests
        env:
          QANTARA_WHISPER_MODEL: "tiny.en"
        run: python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit the base runtime dependency set
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install . "pip-audit==2.10.1"
          # Qantara 0.3.1 is intentionally not on PyPI yet. Removing only the
          # local distribution leaves its resolved third-party dependencies in
          # place for strict auditing without a false "not found" failure.
          python -m pip uninstall --yes qantara
          python -m pip_audit --strict

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
