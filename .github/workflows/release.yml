name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (must match VERSION)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs third-party test and build tooling. Read-only token, no dependency
  # cache (a poisoned cache cannot reach the release), and no signing rights.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require an existing matching tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"

      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Keep these pins in sync with the dev extra in pyproject.toml,
      # test.yml and .pre-commit-config.yaml.
      - name: Install test and release dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade "pip==26.2.1"
          python -m pip install --no-cache-dir ".[test]"
          python -m pip install --no-cache-dir "build==1.6.0" "pip-audit==2.10.1" "ruff==0.16.5" "twine==7.0.0"

      - name: Verify source and tag metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_release_consistency.py --expected "$RELEASE_VERSION"
          python scripts/check_workflow_pins.py
          python scripts/check_docs_links.py
          python scripts/check_docs_consistency.py
          python scripts/check_tracked_artifacts.py
          python scripts/check_lock_hashes.py
          git diff --exit-code
          git tag --points-at HEAD --list "v$RELEASE_VERSION" | grep -Fx "v$RELEASE_VERSION"

      - name: Run release validation
        env:
          QANTARA_WHISPER_MODEL: "tiny.en"
        run: |
          ruff check .
          python -m compileall -q qantara adapters gateway providers discovery tests
          python -m unittest discover -s tests -v

      - name: Build artifacts once
        run: python -m build

      - name: Validate built artifacts
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist/*

      - name: Smoke-test clean installs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/smoke_install.py --expected "$RELEASE_VERSION" dist/*.whl
          python scripts/smoke_install.py --expected "$RELEASE_VERSION" dist/*.tar.gz

      - name: Audit resolved release-check dependencies
        run: |
          # The unreleased local distribution has no PyPI advisory record; its
          # resolved third-party dependencies remain installed after removal.
          python -m pip uninstall --yes qantara
          python -m pip_audit --strict

      # The SBOM describes what `pip install <wheel>` actually installs: the
      # wheel plus its declared runtime dependencies, in an empty target.
      - name: Install the built wheel into a clean SBOM root
        run: python -m pip install --no-cache-dir --target build/sbom-root dist/*.whl

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: build/sbom-root
          format: spdx-json
          output-file: dist/qantara-${{ inputs.version }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM contents
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_spdx_sbom.py \
            --expected-version "$RELEASE_VERSION" \
            dist/qantara-${RELEASE_VERSION}.spdx.json

      - name: Write checksums and validation evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python scripts/write_release_validation.py \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --output dist/release-validation.json \
            dist/*.whl dist/*.tar.gz dist/*.spdx.json
          (
            cd dist
            sha256sum *.whl *.tar.gz *.spdx.json release-validation.json > SHA256SUMS
          )
          python scripts/check_checksum_manifest.py \
            dist/SHA256SUMS \
            dist/*.whl dist/*.tar.gz dist/*.spdx.json dist/release-validation.json

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read

  # Holds the write/signing permissions. Installs nothing from PyPI; it only
  # re-verifies checksums of the validated artifacts, attests and publishes.
  publish:
    needs: [validate, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Re-verify checksums
        run: |
          python3 scripts/check_checksum_manifest.py \
            dist/SHA256SUMS \
            dist/*.whl dist/*.tar.gz dist/*.spdx.json dist/release-validation.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/release-validation.json
            dist/SHA256SUMS

      - name: Create draft GitHub release from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $tag; refusing to replace its artifacts." >&2
            exit 1
          fi
          gh release create "$tag" dist/* \
            --draft \
            --verify-tag \
            --title "Qantara $tag" \
            --generate-notes
