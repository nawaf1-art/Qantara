# Qantara configuration file.
# Copy to qantara.yml and edit to match your setup.
#
# Precedence (highest wins): explicit CLI flags > environment variables >
# this file > built-in defaults. Unknown keys are reported as warnings.
# Values may be quoted ("..." or '...'); a "#" starts a comment only at the
# start of a value or after whitespace.

backend:
  type: openai_compatible    # openai_compatible | ollama | openclaw | custom | mock
  url: http://localhost:11434
  model: qwen3.5:2b
  # agent: main               # only for the advanced OpenClaw bridge

voice:
  stt: faster_whisper
  tts: auto                 # auto | routed | kokoro | piper | chatterbox

server:
  host: 127.0.0.1
  port: 8765
