services:
  ollama:
    image: ollama/ollama:0.32.3@sha256:ec24bcaa2a810eb74171ce7c517813ef4821ed678988845e8d76cf62467036d4
    container_name: qantara-ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:0.32.3@sha256:ec24bcaa2a810eb74171ce7c517813ef4821ed678988845e8d76cf62467036d4
    container_name: qantara-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-lc", "ollama pull qwen3.5:2b"]
    restart: "no"

  qantara-backend:
    image: qantara:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qantara-backend
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      # 0.0.0.0 inside the container only: port 19120 is exposed to the
      # compose network (for qantara-gateway), never published to the host.
      QANTARA_REAL_BACKEND_HOST: 0.0.0.0
      QANTARA_REAL_BACKEND_PORT: 19120
      QANTARA_OLLAMA_BASE_URL: http://ollama:11434
      QANTARA_OLLAMA_MODEL: qwen3.5:2b
      QANTARA_OLLAMA_THINK: "false"
    expose:
      - "19120"
    command: ["python", "gateway/ollama_session_backend/server.py"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:19120/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  qantara-gateway:
    image: qantara:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qantara-gateway
    depends_on:
      qantara-backend:
        condition: service_healthy
    environment:
      QANTARA_SPIKE_HOST: 0.0.0.0
      QANTARA_SPIKE_PORT: 8765
      QANTARA_ADAPTER: ${QANTARA_ADAPTER:-session_gateway_http}
      QANTARA_BACKEND_BASE_URL: http://qantara-backend:19120
      QANTARA_STT_PROVIDER: faster_whisper
      QANTARA_TTS_PROVIDER: kokoro
      QANTARA_DEFAULT_SPEECH_RATE: 1.2
      QANTARA_WHISPER_MODEL: small
      # Required before publishing the port beyond loopback: the gateway
      # refuses non-loopback requests without a token. See ops/README.md.
      QANTARA_AUTH_TOKEN: ${QANTARA_AUTH_TOKEN:-}
      QANTARA_ADMIN_TOKEN: ${QANTARA_ADMIN_TOKEN:-}
      QANTARA_OLLAMA_BASE_URL: http://ollama:11434
      QANTARA_WHISPER_DEVICE: cpu
      QANTARA_WHISPER_COMPUTE: int8
      QANTARA_KOKORO_DEVICE: cpu
      QANTARA_KOKORO_VOICE: af_heart
      # MCP client adapter settings; used only with QANTARA_ADAPTER=mcp.
      QANTARA_MCP_TRANSPORT: ${QANTARA_MCP_TRANSPORT:-stdio}
      QANTARA_MCP_COMMAND: ${QANTARA_MCP_COMMAND:-}
      QANTARA_MCP_URL: ${QANTARA_MCP_URL:-}
      QANTARA_MCP_CHAT_TOOL: ${QANTARA_MCP_CHAT_TOOL:-chat}
      # Multi-device mesh (mDNS discovery) and the MCP voice server are
      # native-only: container bridge networking blocks multicast discovery,
      # and this image runs only the gateway. See docs/MESH.md and
      # docs/MCP.md for native setup.
    volumes:
      # Hugging Face / faster-whisper / Kokoro weights; survives `compose down`.
      - qantara-model-cache:/home/qantara/.cache
    ports:
      - "${QANTARA_DOCKER_BIND:-127.0.0.1}:${QANTARA_PORT:-8765}:8765"
    command: ["python", "gateway/transport_spike/server.py"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/api/status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  ollama-data:
  qantara-model-cache:
